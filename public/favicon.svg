<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e1c2e"/>
      <stop offset="100%" stopColor="#0C0B12"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#c4bbf0"/>
      <stop offset="50%" stopColor="#8B7FD4"/>
      <stop offset="100%" stopColor="#6c5ecf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#8B7FD4" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#8B7FD4" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 4-point sparkle / creator star (signature ari.codes* mark) -->
  <g filter="url(#glow)">
    <!-- Central 4-pointed star -->
    <path d="M32 10 C32 22 22 32 10 32 C22 32 32 42 32 54 C32 42 42 32 54 32 C42 32 32 22 32 10 Z" fill="url(#starGrad)"/>
    <!-- Center bright sparkle core -->
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Corner accent dots -->
  <circle cx="16" cy="16" r="1" fill="#8B7FD4" opacity="0.5"/>
  <circle cx="48" cy="16" r="1" fill="#8B7FD4" opacity="0.5"/>
  <circle cx="16" cy="48" r="1" fill="#8B7FD4" opacity="0.5"/>
  <circle cx="48" cy="48" r="1" fill="#8B7FD4" opacity="0.5"/>
</svg>